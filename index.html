<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown — August 18, 2026 at 16:35 (Europe/Bucharest)</title>
<meta name="description" content="Live countdown timer to August 18, 2026 at 16:35 in the Europe/Bucharest time zone, with confetti celebration at zero.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,sans-serif;background:#0b1020;color:#fff;display:grid;place-items:center;height:100vh}
.wrap{text-align:center}.timer{display:flex;gap:20px;justify-content:center}.unit{background:#1a2240;padding:20px;border-radius:12px}.num{font-size:3rem;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
<h1>Countdown to August 18, 2026 — 16:35 Bucharest time</h1>
<div class="timer">
<div class="unit"><div id="d" class="num"></div><div>Days</div></div>
<div class="unit"><div id="h" class="num"></div><div>Hours</div></div>
<div class="unit"><div id="m" class="num"></div><div>Minutes</div></div>
<div class="unit"><div id="s" class="num"></div><div>Seconds</div></div>
</div>
<p id="done" style="display:none;font-size:2rem;color:#7cffc4">It's 16:35 on August 18, 2026 in Bucharest 🎉</p>
</div>
<script>
function off(date,tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const p=Object.fromEntries(f.formatToParts(date).map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-date.getTime();}
function z2u(y,mo,d,h,mi,s,tz){const g=new Date(Date.UTC(y,mo-1,d,h,mi,s));return new Date(g.getTime()-off(g,tz));}
const target=z2u(2026,8,18,16,35,0,'Europe/Bucharest');
const ids={d:d,h:h,m:m,s:s};
setInterval(()=>{let diff=target-new Date();if(diff<=0){for(let k in ids)ids[k].textContent='00';done.style.display='block';return;}
let sec=Math.floor(diff/1000);ids.d.textContent=String(Math.floor(sec/86400)).padStart(2,'0');ids.h.textContent=String(Math.floor(sec%86400/3600)).padStart(2,'0');ids.m.textContent=String(Math.floor(sec%3600/60)).padStart(2,'0');ids.s.textContent=String(sec%60).padStart(2,'0');},1000);
</script>
</body></html>
