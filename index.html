<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown — June 7, 2026 at 11:00 (Europe/Bucharest)</title>
  <meta name="description" content="Live countdown timer to June 7, 2026 at 11:00 in the Europe/Bucharest time zone, with confetti celebration at zero." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b1020;
      --card: #121832;
      --accent: #7aa2ff;
      --muted: #9aa3b2;
      --text: #e8edf7;
      --success: #7cffc4;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, #19234a 0%, transparent 50%),
        radial-gradient(1000px 600px at 80% 80%, #0f1736 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .wrap {
      text-align: center;
      width: min(900px, 100%);
    }

    h1 {
      font-size: clamp(28px, 4vw, 44px);
      margin-bottom: 10px;
      font-weight: 800;
    }

    .sub {
      color: var(--muted);
      margin-bottom: 30px;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .unit {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 18px;
    }

    .num {
      font-size: clamp(32px, 6vw, 60px);
      font-weight: 800;
    }

    .label {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    .done {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 700;
      color: var(--success);
      opacity: 0;
      transform: scale(0.9);
      transition: 0.4s;
    }

    .celebrate {
      opacity: 1;
      transform: scale(1);
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
<canvas id="confetti"></canvas>

<div class="wrap">
  <h1>Countdown to June 7, 2026 — 11:00 Bucharest time</h1>
  <div class="sub">Time zone: Europe/Bucharest</div>

  <div class="timer">
    <div class="unit"><div class="num" id="d">0</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="h">0</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="m">0</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="s">0</div><div class="label">Seconds</div></div>
  </div>

  <div class="note" id="note"></div>
  <div class="done" id="done">It's 11:00 on June 7, 2026 in Bucharest 🎉</div>
</div>

<script>
function getOffset(date, tz) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  });

  const parts = Object.fromEntries(
    dtf.formatToParts(date).map(p => [p.type, p.value])
  );

  const asUTC = Date.UTC(
    +parts.year,
    +parts.month - 1,
    +parts.day,
    +parts.hour,
    +parts.minute,
    +parts.second
  );

  return asUTC - date.getTime();
}

function zonedTimeToUtc(year, month, day, hour, minute, second, tz) {
  const guess = new Date(Date.UTC(year, month - 1, day, hour, minute, second));
  const offset = getOffset(guess, tz);
  return new Date(guess.getTime() - offset);
}

const TZ = "Europe/Bucharest";
const targetUTC = zonedTimeToUtc(2026, 6, 7, 11, 0, 0, TZ);

const dEl = document.getElementById("d");
const hEl = document.getElementById("h");
const mEl = document.getElementById("m");
const sEl = document.getElementById("s");
const note = document.getElementById("note");
const done = document.getElementById("done");

function pad(n){ return String(n).padStart(2,"0"); }

function update(){
  const diff = targetUTC - new Date();

  if(diff <= 0){
    dEl.textContent = hEl.textContent = mEl.textContent = sEl.textContent = "00";
    done.classList.add("celebrate");
    launchConfetti();
    return;
  }

  const sec = Math.floor(diff/1000)%60;
  const min = Math.floor(diff/1000/60)%60;
  const hr = Math.floor(diff/1000/60/60)%24;
  const day = Math.floor(diff/1000/60/60/24);

  dEl.textContent = pad(day);
  hEl.textContent = pad(hr);
  mEl.textContent = pad(min);
  sEl.textContent = pad(sec);

  note.textContent = "Countdown active for Bucharest time zone.";
}

setInterval(update, 1000);
update();

/* simple confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let parts = [];

function launchConfetti(){
  for(let i=0;i<200;i++){
    parts.push({
      x: innerWidth/2,
      y: innerHeight/2,
      vx: (Math.random()-0.5)*10,
      vy: (Math.random()-1)*10,
      g: 0.3
    });
  }

  requestAnimationFrame(loop);
}

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  parts.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.g;

    ctx.fillRect(p.x,p.y,4,4);
  });

  parts = parts.filter(p => p.y < innerHeight);
  if(parts.length) requestAnimationFrame(loop);
}
</script>

</body>
</html>
